name: CI Pipeline

# Based on the AGRARIAN application template CI. Adapted only where the
# AgriSPEX service differs from the template default: the service listens on
# 80, matching the AGRARIAN application template and every other app in the
# organisation. The port is overridable at runtime via the PORT env var.

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-application:
    name: Test Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test application compilation
        run: |
          echo "🧪 Testing application compilation..."
          python -c "import sys; sys.path.append('src'); from app import app; print('✅ App compiles successfully')"

      - name: Check for hardcoded passwords
        run: |
          echo "🔍 Checking for hardcoded passwords..."
          if grep -r "password=" src/; then
            echo "❌ Hardcoded passwords found!"
            exit 1
          fi
          if grep -r "secret=" src/; then
            echo "❌ Hardcoded secrets found!"
            exit 1
          fi
          if grep -r "api_key" src/; then
            echo "❌ Hardcoded API keys found!"
            exit 1
          fi
          if grep -r "token=" src/; then
            echo "❌ Hardcoded tokens found!"
            exit 1
          fi
          echo "✅ No hardcoded passwords found"

      - name: Smoke-test the API without a database
        run: |
          echo "🧪 Health endpoint must stay 200 while the DB is unreachable..."
          pip install httpx
          python - <<'PY'
          import sys
          sys.path.append('src')
          from fastapi.testclient import TestClient
          from app import app

          with TestClient(app) as client:
              r = client.get("/health")
              assert r.status_code == 200, f"/health returned {r.status_code}"
              assert r.json()["alive"] is True
              print("✅ /health ->", r.status_code, r.json()["status"])

              r = client.get("/")
              assert r.status_code == 200, f"/ returned {r.status_code}"
              print("✅ / ->", r.status_code)

              r = client.get("/ready")
              assert r.status_code in (200, 503), f"/ready returned {r.status_code}"
              print("✅ /ready ->", r.status_code, "(503 expected with no DB)")

              r = client.get("/iot/simulate?at=2026-05-12T09:30:00Z")
              assert r.status_code == 200, f"/iot/simulate returned {r.status_code}"
              assert r.json()["source"] == "synthetic"
              print("✅ /iot/simulate ->", r.status_code, r.json()["source"])
          PY

  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test-application
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/agrarian-application-repository/${{ github.event.repository.name }}:latest
            ghcr.io/agrarian-application-repository/${{ github.event.repository.name }}:0.1.0
            ghcr.io/agrarian-application-repository/${{ github.event.repository.name }}:sha-${{ github.sha }}

  push-to-github-packages:
    name: Push to GitHub Package
    runs-on: ubuntu-latest
    needs: build-docker-image
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Test Docker image
        run: |
          echo "🐳 Testing Docker image..."
          IMAGE=ghcr.io/agrarian-application-repository/${{ github.event.repository.name }}:latest
          echo "Pulling image: $IMAGE"
          docker pull "$IMAGE" || { echo "❌ Failed to pull Docker image"; exit 1; }

          echo "Starting container..."
          docker run -d --name test-app -p 8080:80 "$IMAGE" || { echo "❌ Failed to start container"; exit 1; }

          echo "Waiting for container to start..."
          sleep 15

          echo "Testing health endpoint..."
          curl -f http://localhost:8080/health || echo "⚠️ Health check failed, but continuing..."

          echo "Testing main endpoint..."
          curl -f http://localhost:8080/ || echo "⚠️ Main endpoint failed, but continuing..."

          echo "Cleaning up..."
          docker stop test-app || true
          docker rm test-app || true
          echo "✅ Docker image test completed"

      - name: Verify image in GitHub Packages
        run: |
          echo "📦 Image: ghcr.io/agrarian-application-repository/${{ github.event.repository.name }}"
          echo "🔗 View packages at: https://github.com/orgs/AGRARIAN-Application-Repository/packages"
